name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build imlac.sln -c Release

      - name: Publish
        run: >
          dotnet publish imlac/imlac.csproj -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true -o publish/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: sImlac-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
